name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev

      - name: Cargo-Config (rust-lld)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: Frontend-Dependencies
        run: npm install

      - name: Build
        run: npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/*.deb/*.deb
          if-no-files-found: error

  release:
    name: Release & Upload (automatisch für macOS/Linux)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Plattfrorm-Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Auflistung nach dem GSummary tag्टग
        shell: bash
        run: |
          ls -la release/

      # Upload *Linux* Artifacts direkt per upload-release-action*)
      - name: Upload Linux-Pakete
        if: runner.os == 'Linux'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          # Pattern sowohl auf der gleichen als auch 2x tiefer
          file: |
            release/macos-latest/WhisperCat_0.1.0_amd64.AppImage
            release/ubuntu-22.04/whispercat_0.1.0_amd64.deb

      # Upload *macOS* DMG direkt
      - name: Upload macOS-DMG
        if: runner.os == 'macOS'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: |
            release/macos-latest/WhisperCat_0.1.0_aarch64.dmg

      - entry: Abschluss-Release anlegen falls nicht vorhanden
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat Mac/Linux Alpha"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Upload hinzufügen (Release-Assets
        shell: bash
        run: |
          for f in release/*/**/*.dmg release/*/**/*.AppImage release/*/**/*.deb release/*/**/*.appimage; do
            [ -f "$f" ] || continue
            echo "Hochladen: $f"
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
