name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-platform:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file

      - name: Frontend-Dependencies
        run: npm install

      # macOS & Linux: tauri-action mit rust-lld
      - name: Build & Build-Artefakte (macOS/Linux)
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "-- --use-bundler"

      - name: Upload Linux/macOS-Artefakte
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.appimage
          if-no-files-found: error

      # Windows: bash-Workaround
      - name: Build (Windows / Workaround in bash)
        if: runner.os == 'Windows'
        shell: bash
        run: npm run tauri build -- --use-bundler

      - name: Upload Windows-Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  release:
    name: GitHub Release (inkl. etwa leerer Artefakte)
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download gesammelter Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Release anlegen/setzen (erstellt idempotent das Draft-Release)
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Upload Linux-Pakete
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for f in release/*/WhisperCat*.AppImage release/*/*.deb; do
            [ -f "$f" ] || continue
            echo "Upload Linux: $f"
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Upload macOS-DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in release/*/*.dmg; do
            [ -f "$f" ] || continue
            echo "Upload macOS: $f"
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Upload Windows-Installer (wenn erfolgreich)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in release/*/*.exe release/*/*.msi; do
            [ -f "$f" ] || continue
            echo "Upload Windows: $f"
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
