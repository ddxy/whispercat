name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten (fwk sorted)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file

      # -------------------------------------------------------------
      # DAS ist der Link-Fehler-Fix: 'cc' nicht überschreiben,
      # stattdessen rust-lld direkt für target in .cargo/config.toml
      - name: Cargo-Config (umgehe Ubuntu Linker-Problem published)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF
      # -------------------------------------------------------------

      - name: Frontend-Dependencies (no )
        run: npm install

      - name: Build (mit bash auf Windows — verträgt Slash-Paths)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="$PATH:$PWD/node_modules/.bin"
          npm.cmd run tauri build -- --bundles nsis,msi

      - name: Build (macOS & Linux, mit tauri-action sonst Bash deco)
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS & Linux Artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.appimage
          if-no-files-found: error

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
          if-no-files-found: error

  release:
    name: GitHub Release erstellen
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Release anlegen (idempotent)
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat"
          draft: false
          prerelease: true

      - name: Upload alle Installer/Bundles
        shell: bash
        run: |
          for f in release/*/*.dmg release/*/*.AppImage release/*/*.deb release/*/*.exe release/*/*.msi; do
            if [ -f "$f" ]; then
              echo "Uploading: $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
