name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-System-Bibliotheken (FRUSTFUNAT)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev
          # Sicherheits-Check per ldconfig (reduziert "libxdo not found" nach Build-Cache)
          ldconfig -p | grep xdo || true

      - name: Cargo-Config (für rust-lld mit link-ctlibs)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          [env]
          PKG_CONFIG_PATH = "/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          EOF

      - name: Frontend-Dependencies
        run: npm install

      - name: Build (macOS & Linux)
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Upload (Windows GH friendly)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="$PATH:$PWD/node_modules/.bin"
          npm.cmd run tauri build -- --bundles nsis,msi --verbose

      - name: Upload Windows (inkl. dual運ルーの "EventHandler)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            src-tauri/target/release/**/*.exe
            src-tauri/target/release/**/*.msi
          if-no-files-found: error

      - name: Upload macOS/Linux Artefakte
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/*.deb/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release an-legen
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Plattfrorm-Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Release tgt (gleichzeitig alle Branch-State)
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat Alpha"
          draft: false
          prerelease: true

      - name: Upload Artefakt nach Platform
        shell: bash
        run: |
          for pattern in "dmg" "AppImage" "deb" "exe" "msi"; do
            for f in release/*/*."$pattern" release/*/*/"WhisperCat$pattern"; do
              [ -f "$f" ] || continue
              echo " hochladen: $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
