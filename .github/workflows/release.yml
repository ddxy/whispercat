name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev

      - name: Cargo-Config (rust-lld für ubuntu-xdo)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: Frontend-Dependencies
        run: npm install

      # Einfacher, bewährter Build ohne tauri-action-Wrapper (grífser Entscheid)
      - name: Build (macOS/Linux)
        run: npm run tauri build

      - name: Upload Artifacts zum nächsten Job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/*.deb/*.deb
          if-no-files-found: error

  release:
    name: Release & Upload (automatisch für macOS/Linux)
    needs: build
    if: always()   # ist erfolgreich, auch wenn der andere Build (z.B. Windows).
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Plattfrorm-Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      # Release mit Standard-ID, wenn Tag v* formatiert
      - name: Release anlegen (upsert)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — WhisperCat (macOS & Linux)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.appimage
          fail_on_unmatched_files: true
