name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev

      - name: Cargo-Config (für rust-lld)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: Frontend-Dependencies
        run: npm install

      - name: Tauri Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub Release (inkl. OSX+Linux Paketen)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Release anlegen
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat (macOS & Linux Alpha)"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Upload Installer (dmg/AppImage/deb)
        shell: bash
        run: |
          for pattern in dmg AppImage deb appimage; do
            for f in release/*/*."$pattern"; do
              [ -f "$f" ] || continue
              echo "Upload: $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
