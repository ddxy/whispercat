name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev

      - name: Cargo-Config (rust-lld für xdo)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: Frontend-Dependencies
        run: npm install

      - name: Build
        run: npm run tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/*.deb/*.deb
          if-no-files-found: error

  release:
    name: Release & Upload (macOS/Linux automatisch)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Plattfrorm-Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Debug-Ausgabe aller verfügbaren Download-Ebenen
        shell: bash
        run: |
          echo "=== .- Struktur in release/ ==="
          find release -type f | sed 's|^release/||' | sort
          echo "=== *.dateien auf macos-latest ==="
          ls -la release/macos-latest/ | head -n 20 || true
          echo "=== *.dateien auf ubuntu-latest ==="
          ls -la release/ubuntu-22.04/ | head -n 20 || true

      # Informell: Erweitere globale Struktur sodass wir die Dateien finden wenn sie in Unterordner liegen
      - name: Upload macOS-DMG
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: release/macos-latest/*.dmg
          overwrite: true

      - name: Upload Linux-Pakete
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: release/ubuntu-22.04/*.AppImage release/ubuntu-22.04/*.deb release/ubuntu-22.04/*.appimage
          overwrite: true
