name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------- WINDOWS -------------------------
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    continue-on-error: true   # bei Windows jederzeit aW-scheiter eklatant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend-Dependencies
        run: npm install

      # Dein bewährter Workaround aus Lauf 2 (ocean auf Windows durchlauf)
      - name: Tauri Build mit bypass Standard-Script ausführen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ""  # Deaktiviert "npm run tauri build" intern

      - name: Windows-Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Windows-artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ------------------------- MAC + LINUX --------------------
  build-mac-linux:
    name: ${{ matrix.os }} Build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten (inkl. xdo)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev file libxdo-dev
          ldconfig -p | grep xdo || true

      - name: Cargo-Config (Link-Wechsel für Ubuntu .xdo mit rust-lld
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: Frontend-Dependencies
        run: npm install

      # Normaler tauri-action-Build (lief unter Linux/Mac in Lauf 2 durch)
      - name: Build macOS / Linux
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifacts hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/*.deb/*.deb
          if-no-files-found: error

  # --------------------------- RELEASE --------------------------
  release:
    name: Release erstellen & Assets hochladen
    needs: [build-windows, build-mac-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download aller Plattfrorm-Artefakte
        uses: actions/download-artifact@v4
        with:
          path: release/
          pattern: '*-artifacts'

      - name: Release anlegen (idempotent)
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.ref_name }}"
          release_name: "${{ github.ref_name }} — WhisperCat Alpha"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Upload installer für alle Plattformen
        shell: bash
        run: |
          for pattern in dmg AppImage deb exe msi; do
            for f in release/*/*."$pattern"; do
              [ -f "$f" ] || continue
              echo "Hochladen: $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
